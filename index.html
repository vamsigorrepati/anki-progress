<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anki Progress</title>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb;
  --card: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a8984;
  --line: #e6e5e1;
  --track: #efeeea;
  --s-study: #2a78d6;
  --s-claude: #eb6834;
  --s-slow: #1baf7a;
  --s-practice: #7c5cdb;
  --s-break: #c9c8c2;
  --accent: #2a78d6;
  --bad: #c43d3c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19;
    --card: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8d8c84;
    --line: #34332f;
    --track: #2b2a27;
    --s-study: #3987e5;
    --s-claude: #d95926;
    --s-slow: #199e70;
    --s-practice: #9b82ec;
    --s-break: #4d4c47;
    --accent: #3987e5;
    --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --card: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8d8c84;
  --line: #34332f; --track: #2b2a27; --s-study: #3987e5; --s-claude: #d95926;
  --s-slow: #199e70; --s-practice: #9b82ec; --s-break: #4d4c47; --accent: #3987e5; --bad: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
main { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; overflow-wrap: anywhere; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 36px 0 10px; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--ink-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 45%), 1fr)); gap: 18px 16px; margin-top: 18px; }
.big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lbl { color: var(--ink-2); font-size: 12px; }
.tl { position: relative; height: 30px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 4px; overflow: hidden; }
.tl i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.pr { margin: 14px 0 6px; } .pr.empty { opacity: .55; }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 13px; margin-bottom: 4px; }
.pn { font-weight: 600; min-width: 84px; } .ps { color: var(--ink-2); } .ps b { color: var(--ink); font-weight: 600; }
.tl span[data-k="off"], .offsw { background: repeating-linear-gradient(135deg, var(--line) 0 4px, var(--card) 4px 8px) !important; box-shadow: inset 0 0 0 1px var(--line); }
.ps i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.tl span { position: absolute; top: 0; bottom: 0; }
.tlx { position: relative; height: 18px; color: var(--ink-3); font-size: 11px; }
.tlx span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--ink-2); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; }
td { border-bottom: 1px solid var(--line); padding: 7px 8px 7px 0; vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goalline { font-size: 17px; margin: 4px 0 12px; }
.goalline b { font-weight: 600; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 28px 32px; }
.chart { min-width: 0; }
.scroll { overflow-x: auto; }
.chart h3 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
.chart .sub { margin-bottom: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 10px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--accent); }
.chart .bar.today { fill: var(--accent); opacity: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover + .bar, .chart g:hover .bar { opacity: .75; }
#tip {
  position: fixed; pointer-events: none; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; z-index: 10; white-space: nowrap;
}
details { margin-top: 10px; }
/* collapsible sections: click a heading to fold it; remembered on this device */
details.sec { margin-top: 0; }
details.sec > summary { list-style: none; display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: inherit; user-select: none; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary h2 { margin: 36px 0 10px; }
details.sec > summary::before { content: "▾"; color: var(--ink-2); font-size: 18px; margin-top: 26px; width: 16px; text-align: center; transition: transform .15s; }
details.sec:not([open]) > summary::before { transform: rotate(-90deg); }
details.sec:not([open]) > summary h2 { margin-bottom: 0; }
details.sec > summary:hover h2 { color: var(--accent); }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
/* lock screen */
#lock { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
#lock form { width: 100%; max-width: 320px; }
#lock input[type=password] {
  width: 100%; font: inherit; padding: 10px 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 14px 0 10px;
}
#lock button {
  font: inherit; padding: 9px 16px; border-radius: 6px; border: 0; background: var(--accent);
  color: #fff; cursor: pointer; width: 100%;
}
#lock .err { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 8px; }
#lock label.rem { font-size: 13px; color: var(--ink-2); display: block; margin-bottom: 12px; }
#app { display: none; }
@media (max-width: 480px) {
  .charts { grid-template-columns: 1fr; }
  .big { font-size: 22px; }
}
</style>
</head>
<body>
<main>
  <section id="lock">
    <form id="f">
      <h1>Anki Progress</h1>
      <div class="sub">This page is locked.</div>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
      <button type="submit" id="go">Open</button>
      <div class="err" id="err"></div>
    </form>
  </section>
  <section id="app"></section>
</main>
<div id="tip"></div>
<script>
const ITER = 600000;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function decrypt(b64, password) {
  const bytes = Uint8Array.from(atob(b64.trim()), (c) => c.charCodeAt(0));
  if (new TextDecoder().decode(bytes.slice(0, 8)) !== "Salted__") throw new Error("bad file");
  const salt = bytes.slice(8, 16), ct = bytes.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function open(password, remember) {
  $("#err").textContent = "";
  $("#go").textContent = "Opening…";
  try {
    const r = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("no data yet");
    const data = await decrypt(await r.text(), password);
    window.__pw = password;
    try { if (remember) localStorage.setItem("ap_pw", password); } catch (e) {}
    $("#lock").style.display = "none";
    $("#app").style.display = "block";
    render(data);
  } catch (e) {
    try { localStorage.removeItem("ap_pw"); } catch (x) {}
    $("#err").textContent = e.message === "no data yet" ? "No progress published yet." : "Wrong password.";
  } finally {
    $("#go").textContent = "Open";
  }
}

$("#f").addEventListener("submit", (e) => { e.preventDefault(); open($("#pw").value, $("#rem").checked); });

/* ---------- formatting ---------- */
const dur = (min) => {
  if (min == null) return "–";
  const m = Math.round(min);
  return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;
};
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const ago = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}h ago` : new Date(ms).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
};
const shortDate = (d) => { const [y, mo, da] = d.split("-").map(Number); return new Date(y, mo - 1, da).toLocaleDateString([], { month: "short", day: "numeric" }); };

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
}
const hideTip = () => (tip.style.display = "none");

/* ---------- bar chart (one series, one axis) ---------- */
function barChart(days, field, fmt, title, note) {
  const W = 420, H = 150, L = 34, B = 20, T = 8;
  const vals = days.map((d) => d[field] ?? 0);
  const max = Math.max(1, ...vals);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = max / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const bw = (W - L) / days.length;
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  let g = "";
  for (const f of [0, 0.5, 1]) {
    const v = nice * f, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${fmt(v, true)}</text>`;
  }
  days.forEach((d, i) => {
    const v = d[field] ?? 0, x = L + i * bw + 1, w = Math.max(bw - 2, 1), yy = y(v), h = Math.max(H - B - yy, v ? 2 : 0);
    const r = Math.min(4, w / 2, h);
    // rounded top, square at the baseline
    const path = h ? `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + w - r} Q${x + w},${yy} ${x + w},${yy + r} V${H - B} Z` : "";
    g += `<g data-i="${i}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>${path ? `<path class="bar" d="${path}"/>` : ""}</g>`;
    if (i % 7 === days.length % 7 || i === days.length - 1)
      g += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${i === days.length - 1 ? "today" : shortDate(d.date)}</text>`;
  });
  const id = "c" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    document.querySelectorAll(`#${id} g[data-i]`).forEach((el) => {
      const d = days[+el.dataset.i];
      el.addEventListener("mousemove", (e) => showTip(e, `<b>${d.date === days[days.length - 1].date ? "Today" : shortDate(d.date)}</b><br>${esc(title)}: ${fmt(d[field])}`));
      el.addEventListener("mouseleave", hideTip);
    });
  });
  return `<div class="chart"><h3>${esc(title)}</h3><div class="sub">${esc(note)}</div><svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} per day, last ${days.length} days">${g}</svg></div>`;
}

/* total studying = cards (Anki review, Claude chats taken out) + asking Claude + practice questions */
function split(x) {
  // total = all active time minus breaks (sent by Anki); older days: cards + Claude + practice
  const claude = x.claude_min || 0, practice = x.practice_min || 0;
  if (x.total_min != null) {
    const cards = x.cards_min != null ? x.cards_min : Math.max(0, x.total_min - claude - practice);
    return { cards, claude, practice, total: x.total_min };
  }
  const cards = Math.max(0, (x.study_min || 0) - claude);
  return { cards, claude, practice, total: cards + claude + practice };
}

/* study time per day as stacked bars: cards / Claude / practice */
function stackChart(days, title, note) {
  const W = 420, H = 150, L = 34, B = 20, T = 8;
  const parts = [["cards", "var(--s-study)", "Cards"], ["claude", "var(--s-claude)", "Asking Claude"], ["practice", "var(--s-practice)", "Practice questions"]];
  const sp = days.map(split);
  const max = Math.max(1, ...sp.map((v) => v.total));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = max / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const bw = (W - L) / days.length;
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  const ax = (v) => (v >= 60 ? Math.round(v / 60) + "h" : Math.round(v) + "m");
  let g = "";
  for (const f of [0, 0.5, 1]) {
    const v = nice * f, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${ax(v)}</text>`;
  }
  days.forEach((d, i) => {
    const x = L + i * bw + 1, w = Math.max(bw - 2, 1);
    let base = 0, segs = "";
    parts.forEach(([k, col]) => {
      const v = sp[i][k];
      if (v > 0) {
        const y1 = y(base + v), y0 = y(base);
        segs += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(y0 - y1, 1)}" fill="${col}"/>`;
        base += v;
      }
    });
    g += `<g data-i="${i}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>${segs}</g>`;
    if (i % 7 === days.length % 7 || i === days.length - 1)
      g += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${i === days.length - 1 ? "today" : shortDate(d.date)}</text>`;
  });
  const id = "c" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    document.querySelectorAll(`#${id} g[data-i]`).forEach((el) => {
      const d = days[+el.dataset.i], v = sp[+el.dataset.i];
      el.addEventListener("mousemove", (e) => showTip(e, `<b>${d.date === days[days.length - 1].date ? "Today" : shortDate(d.date)}</b> · ${dur(v.total)} total<br>` +
        parts.map(([k, col, name]) => `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${col};margin-right:5px"></i>${name}: ${dur(v[k])}`).join("<br>")));
      el.addEventListener("mouseleave", hideTip);
    });
  });
  const legend = parts.map(([, col, name]) => `<span><i style="background:${col}"></i>${name}</span>`).join("");
  return `<div class="chart"><h3>${esc(title)}</h3><div class="sub">${esc(note)}</div><svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} per day">${g}</svg><div class="legend">${legend}</div></div>`;
}

/* ---------- page ---------- */
function render(d) {
  const t = d.today;
  // a section you can fold; open/closed is remembered per device (and survives the 2-min refresh)
  const sec = (key, title, body) => {
    let shut = false;
    try { shut = localStorage.getItem("ap_sec_" + key) === "0"; } catch (e) {}
    return `<details class="sec" data-sec="${key}"${shut ? "" : " open"}><summary><h2>${title}</h2></summary>${body}</details>`;
  };
  const tile = (v, l) => `<div><div class="big">${v}</div><div class="lbl">${l}</div></div>`;
  let h = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h1>Anki Progress</h1><button id="rf" style="font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer">Refresh</button></div><div class="sub" id="upd">Data from ${clock(d.generated)} (${ago(d.generated)}) · ${new Date(d.generated).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })} · checked ${clock(Date.now())}</div>`;

  h += `<div class="tiles">
    ${(() => { const v = split(t); return tile(dur(v.total), `studied today in total (all time minus breaks)<br><span class="muted">cards ${dur(v.cards)} · Claude ${dur(v.claude)} · practice ${dur(v.practice)}</span>`); })()}
    ${tile(t.cards, "cards")}
    ${tile(t.new, "new cards")}
    ${tile(t.reviews, "reviews")}
    ${tile(t.new_per_hr ?? d.rate.new ?? "–", "new cards / hour today" + (d.rate.new && t.new_per_hr ? `<br><span class="muted">last 30 min: ${d.rate.new}/hr</span>` : ""))}
    ${tile(t.retention != null ? t.retention + "%" : "–", "reviews remembered")}
    ${tile(t.pomodoros, "Pomodoros")}
    ${tile(dur(t.claude_min), "asking Claude")}
    ${tile(t.practice_n ? dur(t.practice_min) : "–", "practice questions" + (t.practice_n ? `<br><span class="muted">${t.practice_n} answered · ${Math.round(100 * t.practice_right / t.practice_n)}% right</span>` : ""))}
  </div>`;

  // goal
  if (d.goal) {
    const g = d.goal, L = g.left, total = L.new + L.learning + L.review;
    let gb = "";
    if (!total) gb += `<div class="goalline"><b>Done.</b> Every goal deck is finished.</div>`;
    else {
      const parts = [L.new && `${L.new} new`, L.learning && `${L.learning} learning`, L.review && `${L.review} reviews`].filter(Boolean).join(" · ");
      const fin = g.eta_min ? ` · about <b>${dur(g.eta_min)}</b> of studying at the current pace` : "";
      gb += `<div class="goalline"><b>${parts}</b> left${fin}${g.finish_by ? ` · aiming to finish by ${esc(g.finish_by)}` : ""}</div>`;
      gb += `<div class="scroll"><table><tr><th>Deck</th><th class="n">New</th><th class="n">Learning</th><th class="n">Due</th></tr>` +
        g.decks.map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${x.new ?? 0}</td><td class="n">${x.learning ?? 0}</td><td class="n">${x.review ?? 0}</td></tr>`).join("") +
        `</table></div>`;
    }
    h += sec("goal", "Goal", gb);
  }

  // timeline
  if (d.timeline.length) {
    // Three rows, each a 6-hour window at the same scale (an hour is the same width in
    // every row). Blank = nothing logged; only real breaks are drawn as breaks.
    const t0 = Math.min(...d.timeline.map((s) => s.a)), t1 = Math.max(...d.timeline.map((s) => s.z));
    const H = 3600000, d0 = new Date(t0); d0.setHours(0, 0, 0, 0);
    if (new Date(t0).getHours() < 4) d0.setDate(d0.getDate() - 1);
    const day0 = d0.getTime();
    const periods = [["Morning", Math.min(day0 + 6 * H, t0), day0 + 12 * H], ["Afternoon", day0 + 12 * H, day0 + 18 * H], ["Evening", day0 + 18 * H, Math.max(day0 + 24 * H, t1)]];
    const order = { study: 0, slow: 1, claude: 2, practice: 3, break: 4, off: 5 };
    const names = { study: "Studying", claude: "Asking Claude", slow: "Slow card", practice: "Practice questions", break: "Break", off: "Off" };
    const sorted = d.timeline.slice().sort((a, b) => order[a.k] - order[b.k]);
    let rowsHtml = "";
    periods.forEach(([name, p0, p1]) => {
      const span = p1 - p0, tot = { study: 0, slow: 0, claude: 0, practice: 0, break: 0, off: 0 };
      let segs = "", views = 0;
      sorted.forEach((s, i) => {
        const a = Math.max(s.a, p0), z = Math.min(s.z, p1);
        if (z <= a) return;
        tot[s.k] += (z - a) / 60000;
        if (s.k === "study" && s.a >= p0 && s.a < p1) views += s.v || 0;
        segs += `<span data-s="${i}" data-k="${s.k}" style="left:${(100 * (a - p0)) / span}%;width:${Math.max((100 * (z - a)) / span, 0.4)}%;background:var(--s-${s.k})"></span>`;
      });
      let ticks = "", lines = "";
      for (let h = Math.ceil(p0 / H) * H; h <= p1; h += H) {
        const pos = (100 * (h - p0)) / span;
        const lab = new Date(h).toLocaleTimeString([], { hour: "numeric" }).toLowerCase().replace(" ", "");
        const tr = pos < 1 ? "transform:none" : pos > 99 ? "transform:translateX(-100%)" : "";
        ticks += `<span style="left:${pos}%;${tr}">${lab}</span>`;
        if (pos > 0 && pos < 100) lines += `<i style="left:${pos}%"></i>`;
      }
      const any = Object.values(tot).some((v) => v > 0);
      // practice time inside a study block is not card time
      let pqIn = 0;
      sorted.filter((s) => s.k === "practice").forEach((q) => sorted.filter((s) => s.k === "study").forEach((st) => {
        pqIn += Math.max(0, Math.min(q.z, st.z, p1) - Math.max(q.a, st.a, p0)) / 60000;
      }));
      const bits = [`<b>${dur(Math.max(0, tot.study - tot.claude - tot.slow - pqIn))}</b> cards`];
      if (tot.claude >= 0.5) bits.push(`<i style="background:var(--s-claude)"></i>${dur(tot.claude)} Claude`);
      if (tot.practice >= 0.5) bits.push(`<i style="background:var(--s-practice)"></i>${dur(tot.practice)} practice Qs`);
      if (tot.slow >= 0.5) bits.push(`<i style="background:var(--s-slow)"></i>${dur(tot.slow)} slow cards`);
      if (tot.break >= 0.5) bits.push(`<i style="background:var(--s-break)"></i>${dur(tot.break)} breaks`);
      if (tot.off >= 0.5) bits.push(`<i class="offsw"></i>${dur(tot.off)} off`);
      if (views) bits.push(`${views} views`);
      rowsHtml += `<div class="pr${any ? "" : " empty"}"><div class="ph"><span class="pn">${name}</span><span class="ps">${any ? bits.join(" · ") : "nothing logged"}</span></div>
        <div class="tl">${lines}${segs}</div><div class="tlx">${ticks}</div></div>`;
    });
    h += sec("today", "Today", `${rowsHtml}
      <div class="legend"><span><i style="background:var(--s-study)"></i>studying</span><span><i style="background:var(--s-claude)"></i>asking Claude</span><span><i style="background:var(--s-practice)"></i>practice questions</span><span><i style="background:var(--s-slow)"></i>slow card (2–5 min)</span><span><i style="background:var(--s-break);outline:1px solid var(--line)"></i>break (5+ min)</span><span><i class="offsw"></i>off (class, done)</span></div>
      <div class="sub" style="margin-top:8px">${t.breaks} break${t.breaks === 1 ? "" : "s"}, ${dur(t.break_min)} total.</div>`);
    setTimeout(() => {
      document.querySelectorAll(".tl span[data-s]").forEach((el) => {
        const s = sorted[+el.dataset.s];
        el.addEventListener("mousemove", (e) => showTip(e, `<b>${s.k === "off" && s.why === "class" ? "In class" : names[s.k]}</b><br>${clock(s.a)} – ${clock(s.z)} (${dur((s.z - s.a) / 60000)})`));
        el.addEventListener("mouseleave", hideTip);
      });
    });
  }

  if (d.topics.length) {
    h += sec("topics", "Topics today", `<table><tr><th>Lecture › topic</th><th class="n">Cards</th><th class="n">Views per card</th><th class="n">Claude questions</th></tr>` +
      d.topics.map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${x.cards}</td><td class="n">${(x.views / x.cards).toFixed(1)}</td><td class="n">${x.claude || ""}</td></tr>`).join("") +
      `</table>`);
  }

  // history
  const days = d.history;
  const n = (v) => (v == null ? "–" : Math.round(v));
  h += sec("history", `Last ${days.length} days`, `<div class="charts">
    ${stackChart(days, "Study time", "Cards + asking Claude + practice questions; breaks over 5 min left out")}
    ${barChart(days, "new", n, "New cards", "Cards seen for the first time")}
    ${barChart(days, "reviews", n, "Reviews", "Review cards done")}
    ${barChart(days, "new_per_hr", n, "New cards per hour", "Including every repeat of those cards")}
    ${barChart(days, "practice_min", (v, ax) => (ax ? (v >= 60 ? Math.round(v / 60) + "h" : Math.round(v) + "m") : dur(v)), "Practice questions", "Time on Claude practice questions")}
  </div>` +
    `<details><summary>Table view</summary><table style="margin-top:8px"><tr><th>Day</th><th class="n">Total</th><th class="n">Cards</th><th class="n">New</th><th class="n">Reviews</th><th class="n">Remembered</th><th class="n">New/hr</th><th class="n">Practice</th><th class="n">Pomodoros</th></tr>` +
    days.slice().reverse().filter((x) => x.cards || x.practice_n).map((x) => `<tr><td>${shortDate(x.date)}</td><td class="n">${dur(split(x).total)}</td><td class="n">${dur(split(x).cards)}</td><td class="n">${x.new}</td><td class="n">${x.reviews}</td><td class="n">${x.retention != null ? x.retention + "%" : "–"}</td><td class="n">${x.new_per_hr ?? "–"}</td><td class="n">${x.practice_n ? `${dur(x.practice_min)} · ${x.practice_n} Qs` : ""}</td><td class="n">${x.pomodoros || ""}</td></tr>`).join("") +
    `</table></details>`);

  $("#app").innerHTML = h;
  document.querySelectorAll("details.sec").forEach((el) => el.addEventListener("toggle", () => {
    try { localStorage.setItem("ap_sec_" + el.dataset.sec, el.open ? "1" : "0"); } catch (e) {}
  }));
  $("#rf").onclick = () => refresh(true);
}

async function refresh(manual) {
  if (!window.__pw) return;
  const btn = $("#rf");
  if (btn) btn.textContent = "Checking…";
  try {
    const r = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });
    const data = await decrypt(await r.text(), window.__pw);
    const y = window.scrollY;
    render(data);
    window.scrollTo(0, y);
  } catch (e) {
    if (btn) btn.textContent = "Refresh";
  }
}
// pull new data every 2 minutes while the page is open
setInterval(() => { if (!document.hidden) refresh(false); }, 120000);

// last, so everything above is defined before a remembered password opens the page
try { const saved = localStorage.getItem("ap_pw"); if (saved) open(saved, true); } catch (e) {}
</script>
</body>
</html>
