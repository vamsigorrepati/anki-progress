<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anki Progress</title>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb;
  --card: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a8984;
  --line: #e6e5e1;
  --track: #efeeea;
  --s-study: #2a78d6;
  --s-claude: #eb6834;
  --s-slow: #1baf7a;
  --s-break: #e2e1dc;
  --accent: #2a78d6;
  --bad: #c43d3c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19;
    --card: #222220;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #8d8c84;
    --line: #34332f;
    --track: #2b2a27;
    --s-study: #3987e5;
    --s-claude: #d95926;
    --s-slow: #199e70;
    --s-break: #3a3935;
    --accent: #3987e5;
    --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --card: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8d8c84;
  --line: #34332f; --track: #2b2a27; --s-study: #3987e5; --s-claude: #d95926;
  --s-slow: #199e70; --s-break: #3a3935; --accent: #3987e5; --bad: #e66767;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
main { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; overflow-wrap: anywhere; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 36px 0 10px; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--ink-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 45%), 1fr)); gap: 18px 16px; margin-top: 18px; }
.big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lbl { color: var(--ink-2); font-size: 12px; }
.tl { position: relative; height: 28px; background: var(--s-break); border-radius: 4px; overflow: hidden; }
.tl span { position: absolute; top: 0; bottom: 0; }
.tlx { position: relative; height: 18px; color: var(--ink-3); font-size: 11px; }
.tlx span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--ink-2); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; }
td { border-bottom: 1px solid var(--line); padding: 7px 8px 7px 0; vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goalline { font-size: 17px; margin: 4px 0 12px; }
.goalline b { font-weight: 600; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 28px 32px; }
.chart { min-width: 0; }
.scroll { overflow-x: auto; }
.chart h3 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
.chart .sub { margin-bottom: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 10px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--accent); }
.chart .bar.today { fill: var(--accent); opacity: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover + .bar, .chart g:hover .bar { opacity: .75; }
#tip {
  position: fixed; pointer-events: none; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; z-index: 10; white-space: nowrap;
}
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
/* lock screen */
#lock { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
#lock form { width: 100%; max-width: 320px; }
#lock input[type=password] {
  width: 100%; font: inherit; padding: 10px 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 14px 0 10px;
}
#lock button {
  font: inherit; padding: 9px 16px; border-radius: 6px; border: 0; background: var(--accent);
  color: #fff; cursor: pointer; width: 100%;
}
#lock .err { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 8px; }
#lock label.rem { font-size: 13px; color: var(--ink-2); display: block; margin-bottom: 12px; }
#app { display: none; }
@media (max-width: 480px) {
  .charts { grid-template-columns: 1fr; }
  .big { font-size: 22px; }
}
</style>
</head>
<body>
<main>
  <section id="lock">
    <form id="f">
      <h1>Anki Progress</h1>
      <div class="sub">This page is locked.</div>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <label class="rem"><input type="checkbox" id="rem"> Remember on this device</label>
      <button type="submit" id="go">Open</button>
      <div class="err" id="err"></div>
    </form>
  </section>
  <section id="app"></section>
</main>
<div id="tip"></div>
<script>
const ITER = 600000;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function decrypt(b64, password) {
  const bytes = Uint8Array.from(atob(b64.trim()), (c) => c.charCodeAt(0));
  if (new TextDecoder().decode(bytes.slice(0, 8)) !== "Salted__") throw new Error("bad file");
  const salt = bytes.slice(8, 16), ct = bytes.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function open(password, remember) {
  $("#err").textContent = "";
  $("#go").textContent = "Opening…";
  try {
    const r = await fetch("data.enc?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("no data yet");
    const data = await decrypt(await r.text(), password);
    try { if (remember) localStorage.setItem("ap_pw", password); } catch (e) {}
    $("#lock").style.display = "none";
    $("#app").style.display = "block";
    render(data);
  } catch (e) {
    try { localStorage.removeItem("ap_pw"); } catch (x) {}
    $("#err").textContent = e.message === "no data yet" ? "No progress published yet." : "Wrong password.";
  } finally {
    $("#go").textContent = "Open";
  }
}

$("#f").addEventListener("submit", (e) => { e.preventDefault(); open($("#pw").value, $("#rem").checked); });

/* ---------- formatting ---------- */
const dur = (min) => {
  if (min == null) return "–";
  const m = Math.round(min);
  return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;
};
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const ago = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}h ago` : new Date(ms).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
};
const shortDate = (d) => { const [y, mo, da] = d.split("-").map(Number); return new Date(y, mo - 1, da).toLocaleDateString([], { month: "short", day: "numeric" }); };

/* ---------- tooltip ---------- */
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px";
}
const hideTip = () => (tip.style.display = "none");

/* ---------- bar chart (one series, one axis) ---------- */
function barChart(days, field, fmt, title, note) {
  const W = 420, H = 150, L = 34, B = 20, T = 8;
  const vals = days.map((d) => d[field] ?? 0);
  const max = Math.max(1, ...vals);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = max / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const bw = (W - L) / days.length;
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  let g = "";
  for (const f of [0, 0.5, 1]) {
    const v = nice * f, yy = y(v);
    g += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${fmt(v, true)}</text>`;
  }
  days.forEach((d, i) => {
    const v = d[field] ?? 0, x = L + i * bw + 1, w = Math.max(bw - 2, 1), yy = y(v), h = Math.max(H - B - yy, v ? 2 : 0);
    const r = Math.min(4, w / 2, h);
    // rounded top, square at the baseline
    const path = h ? `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + w - r} Q${x + w},${yy} ${x + w},${yy + r} V${H - B} Z` : "";
    g += `<g data-i="${i}"><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>${path ? `<path class="bar" d="${path}"/>` : ""}</g>`;
    if (i % 7 === days.length % 7 || i === days.length - 1)
      g += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle">${i === days.length - 1 ? "today" : shortDate(d.date)}</text>`;
  });
  const id = "c" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    document.querySelectorAll(`#${id} g[data-i]`).forEach((el) => {
      const d = days[+el.dataset.i];
      el.addEventListener("mousemove", (e) => showTip(e, `<b>${d.date === days[days.length - 1].date ? "Today" : shortDate(d.date)}</b><br>${esc(title)}: ${fmt(d[field])}`));
      el.addEventListener("mouseleave", hideTip);
    });
  });
  return `<div class="chart"><h3>${esc(title)}</h3><div class="sub">${esc(note)}</div><svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} per day, last ${days.length} days">${g}</svg></div>`;
}

/* ---------- phone / other apps ---------- */
function appsSplit(m) {
  // Instagram, TikTok and Messages always named; everything else is "other apps"
  return ["Instagram", "TikTok", "Messages", "Other apps"]
    .filter((k) => (m[k] || 0) >= 0.5)
    .map((k) => `${k === "Other apps" ? "other apps" : k} ${dur(m[k])}`).join(" · ");
}
function appsLine(t) {
  if (!t.apps_breaks) return "";
  const sum = (m) => Object.values(m).reduce((a, b) => a + b, 0);
  const b = sum(t.apps_breaks), s = sum(t.apps_studying);
  let out = ` Phone/other apps: ${dur(b)} during breaks`;
  if (b >= 0.5) out += ` (${appsSplit(t.apps_breaks)})`;
  if (s >= 0.5) out += `, ${dur(s)} while studying (${appsSplit(t.apps_studying)})`;
  return out + ".";
}

/* ---------- page ---------- */
function render(d) {
  const t = d.today;
  const tile = (v, l) => `<div><div class="big">${v}</div><div class="lbl">${l}</div></div>`;
  let h = `<h1>Anki Progress</h1><div class="sub">Updated ${ago(d.generated)} · ${new Date(d.generated).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</div>`;

  h += `<div class="tiles">
    ${tile(dur(t.study_min), "studied today")}
    ${tile(t.cards, "cards")}
    ${tile(t.new, "new cards")}
    ${tile(t.reviews, "reviews")}
    ${tile(d.rate.new ?? t.new_per_hr ?? "–", "new cards / hour")}
    ${tile(t.retention != null ? t.retention + "%" : "–", "reviews remembered")}
    ${tile(t.pomodoros, "Pomodoros")}
    ${tile(dur(t.claude_min), "asking Claude")}
    ${t.apps_breaks ? tile(dur(t.apps_min), "phone / other apps") : ""}
  </div>`;

  // goal
  if (d.goal) {
    const g = d.goal, L = g.left, total = L.new + L.learning + L.review;
    h += `<h2>Goal</h2>`;
    if (!total) h += `<div class="goalline"><b>Done.</b> Every goal deck is finished.</div>`;
    else {
      const parts = [L.new && `${L.new} new`, L.learning && `${L.learning} learning`, L.review && `${L.review} reviews`].filter(Boolean).join(" · ");
      const fin = g.eta_min ? ` · about <b>${dur(g.eta_min)}</b> of studying at the current pace` : "";
      h += `<div class="goalline"><b>${parts}</b> left${fin}${g.finish_by ? ` · aiming to finish by ${esc(g.finish_by)}` : ""}</div>`;
      h += `<div class="scroll"><table><tr><th>Deck</th><th class="n">New</th><th class="n">Learning</th><th class="n">Due</th></tr>` +
        g.decks.map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${x.new ?? 0}</td><td class="n">${x.learning ?? 0}</td><td class="n">${x.review ?? 0}</td></tr>`).join("") +
        `</table></div>`;
    }
  }

  // timeline
  if (d.timeline.length) {
    const t0 = Math.min(...d.timeline.map((s) => s.a)), t1 = Math.max(...d.timeline.map((s) => s.z)), span = Math.max(t1 - t0, 1);
    const order = { study: 0, slow: 1, claude: 2, break: 3 };
    const names = { study: "Studying", claude: "Asking Claude", slow: "Slow card", break: "Break" };
    const segs = d.timeline.slice().sort((a, b) => order[a.k] - order[b.k]).map((s, i) =>
      `<span data-s="${i}" style="left:${(100 * (s.a - t0)) / span}%;width:${Math.max((100 * (s.z - s.a)) / span, 0.4)}%;background:var(--s-${s.k})"></span>`).join("");
    let ticks = `<span style="left:0;transform:none">${clock(t0)}</span><span style="left:100%;transform:translateX(-100%)">${clock(t1)}</span>`;
    h += `<h2>Today</h2><div class="tl" id="tl">${segs}</div><div class="tlx">${ticks}</div>
      <div class="legend"><span><i style="background:var(--s-study)"></i>studying</span><span><i style="background:var(--s-claude)"></i>asking Claude</span><span><i style="background:var(--s-slow)"></i>slow card (2–5 min)</span><span><i style="background:var(--s-break);outline:1px solid var(--line)"></i>break (5+ min)</span></div>
      <div class="sub" style="margin-top:8px">${t.breaks} break${t.breaks === 1 ? "" : "s"}, ${dur(t.break_min)} total.${appsLine(t)}</div>`;
    setTimeout(() => {
      const sorted = d.timeline.slice().sort((a, b) => order[a.k] - order[b.k]);
      document.querySelectorAll("#tl span").forEach((el) => {
        const s = sorted[+el.dataset.s];
        el.addEventListener("mousemove", (e) => showTip(e, `<b>${names[s.k]}</b><br>${clock(s.a)} – ${clock(s.z)} (${dur((s.z - s.a) / 60000)})`));
        el.addEventListener("mouseleave", hideTip);
      });
    });
  }

  if (d.topics.length) {
    h += `<details open><summary>Topics today</summary><table style="margin-top:8px"><tr><th>Lecture › topic</th><th class="n">Cards</th><th class="n">Views per card</th><th class="n">Claude questions</th></tr>` +
      d.topics.map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${x.cards}</td><td class="n">${(x.views / x.cards).toFixed(1)}</td><td class="n">${x.claude || ""}</td></tr>`).join("") +
      `</table></details>`;
  }

  // history
  const days = d.history;
  const n = (v) => (v == null ? "–" : Math.round(v));
  h += `<h2>Last ${days.length} days</h2><div class="charts">
    ${barChart(days, "study_min", (v, ax) => (ax ? (v >= 60 ? Math.round(v / 60) + "h" : Math.round(v) + "m") : dur(v)), "Study time", "Breaks over 5 min left out")}
    ${barChart(days, "new", n, "New cards", "Cards seen for the first time")}
    ${barChart(days, "reviews", n, "Reviews", "Review cards done")}
    ${barChart(days, "new_per_hr", n, "New cards per hour", "Including every repeat of those cards")}
  </div>`;
  h += `<details><summary>Table view</summary><table style="margin-top:8px"><tr><th>Day</th><th class="n">Study</th><th class="n">New</th><th class="n">Reviews</th><th class="n">Remembered</th><th class="n">New/hr</th><th class="n">Pomodoros</th><th class="n">Phone/apps</th></tr>` +
    days.slice().reverse().filter((x) => x.cards).map((x) => `<tr><td>${shortDate(x.date)}</td><td class="n">${dur(x.study_min)}</td><td class="n">${x.new}</td><td class="n">${x.reviews}</td><td class="n">${x.retention != null ? x.retention + "%" : "–"}</td><td class="n">${x.new_per_hr ?? "–"}</td><td class="n">${x.pomodoros || ""}</td><td class="n">${x.apps_min ? dur(x.apps_min) : ""}</td></tr>`).join("") +
    `</table></details>`;

  $("#app").innerHTML = h;
}

// last, so everything above is defined before a remembered password opens the page
try { const saved = localStorage.getItem("ap_pw"); if (saved) open(saved, true); } catch (e) {}
</script>
</body>
</html>
